# Tests the code, then builds the three node images. Pushes to GitHub Container
# Registry, except on pull requests, which only build. Then it runs the pushed
# images from the compose files, on real Docker, and checks the arm64 worker.
# GitHub's machines have no video hardware, so a real hardware encode runs only
# on a self-hosted runner, when started by hand with the hardware input.
name: Images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      hardware:
        description: Also run the hardware encode test on a self-hosted runner with this label
        type: choice
        options: [none, rkmpp]
        default: none

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The pipeline tests skip themselves without these.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg rclone
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: orchestrator
            platforms: linux/amd64
          - image: worker
            platforms: linux/amd64,linux/arm64
          - image: edge-agent
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase, and owners often are not.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      # Only the Debian stage runs emulated. Go cross-compiles natively.
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: deploy/docker/smoke.sh "sha-${GITHUB_SHA::7}"

  # The arm64 worker image on an Arm machine without Rockchip hardware: its
  # ffmpeg must include RKMPP, doctor must explain the missing devices, and a
  # job must fall back to software.
  arm64-worker:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/worker:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker pull --platform linux/arm64 "ghcr.io/${GITHUB_REPOSITORY,,}/worker:sha-${GITHUB_SHA::7}"
      - name: ffmpeg includes RKMPP
        run: |
          ff() { docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg "$IMAGE" -hide_banner "$@"; }
          ff -encoders | grep -w h264_rkmpp
          ff -decoders | grep -w hevc_rkmpp
          ff -filters | grep -w scale_rkrga
      - name: doctor explains the missing devices
        run: |
          out=$(docker run --rm -e ENCODER=rkmpp -e ORCHESTRATOR_URL=http://127.0.0.1:1 -e NODE_TOKEN=x "$IMAGE" doctor 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "vendor kernel"
      - name: A job falls back to software
        run: |
          CGO_ENABLED=0 go test -c -o pipeline.test ./internal/pipeline
          docker run --rm -v "$PWD/pipeline.test:/pipeline.test:ro" -w /tmp \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/bin:/usr/bin:/bin \
            --entrypoint /pipeline.test "$IMAGE" -test.v -test.run 'TestRunFallsBackToSoftware'

  # A real encode on a self-hosted runner with the hardware, inside the
  # published image. Never on pull requests: a public repository's pull
  # requests would run anyone's code on that machine.
  hw-rkmpp:
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.hardware == 'rkmpp'
    runs-on: [self-hosted, linux, arm64, rkmpp]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Encode with RKMPP
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/worker:sha-${GITHUB_SHA::7}"
          CGO_ENABLED=0 go test -c -o pipeline.test ./internal/pipeline
          docker run --rm -v "$PWD/pipeline.test:/pipeline.test:ro" -w /tmp \
            --device /dev/mpp_service --device /dev/rga --device /dev/dri --device /dev/dma_heap \
            --group-add "$(getent group video | cut -d: -f3)" \
            -e JELLYFINNER_HW=rkmpp \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/bin:/usr/bin:/bin \
            --entrypoint /pipeline.test "$image" -test.v -test.run 'TestHardwareEncode'
