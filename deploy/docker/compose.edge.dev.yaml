# Builds the edge agent from source. Needs the whole repository. Use it on top of
# the normal file, from this folder:
#   docker compose -f compose.edge.yml -f compose.edge.dev.yaml up -d --build
x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile.edge-agent

services:
  edge-init:
    build: *build
    image: jellyfinner/edge-agent:local
  edge-pull:
    build: *build
    image: jellyfinner/edge-agent:local
  edge-serve:
    build: *build
    image: jellyfinner/edge-agent:local
