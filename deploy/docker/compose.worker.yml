# Worker node. ./init.sh writes .env, so plain `docker compose up -d` works.
# It encodes on the CPU. For a GPU, add compose.worker-gpu.yml to COMPOSE_FILE.
name: jellyfinner-worker

services:
  worker:
    image: ${JELLYFINNER_IMAGE_PREFIX:-ghcr.io/minoplhy/jellyfinner}/worker:${JELLYFINNER_TAG:-latest}
    restart: unless-stopped
    environment:
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:?set ORCHESTRATOR_URL in .env}
      NODE_TOKEN: ${NODE_TOKEN:?set NODE_TOKEN in .env}
    volumes:
      - ${SCRATCH_HOST:-./data/scratch}:/scratch
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "worker", "health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
