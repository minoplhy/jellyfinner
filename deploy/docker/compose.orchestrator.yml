# Jellyfinner orchestrator node. This file is the whole deployment: paste it
# into your own compose file, change the values marked EDIT, then run
#   docker compose up -d
# It needs no script, no .env and no other files. Check it with
#   docker compose run --rm orchestrator doctor
# Add nodes with
#   docker compose exec orchestrator orchestrator node add worker1
name: jellyfinner-orchestrator

# Runs the services as this UID:GID. Change it if your media needs another user
# to read it. It also sets the owner of the folders below.
x-owner: &owner "10001:10001"

x-app: &app
  image: ghcr.io/minoplhy/jellyfinner/orchestrator:latest # Pin a version to keep nodes matched.
  user: *owner
  restart: unless-stopped
  environment: &settings
    # auto encodes everything new, manual only what someone asks for.
    # Change it later only with orchestrator switch-mode.
    ENCODE_MODE: auto # EDIT
    # The address workers and edge nodes use. It may have a path, such as
    # https://example.com/jellyfinner.
    CONTROL_URL: https://control.example.com # EDIT
    # Jellyfin on this host. For the Jellyfin block below, use http://jellyfin:8096.
    # Add Jellyfin's Base URL if it has one, such as http://host.docker.internal:8096/jellyfin.
    JELLYFIN_URL: http://host.docker.internal:8096 # EDIT
    # Optional in auto, required in manual. Create one in Jellyfin under
    # Dashboard, API Keys.
    JELLYFIN_TOKEN: ""
    # Manual mode: at least 32 characters, such as from openssl rand -hex 32.
    # Also uncomment port 8201 below. Jellyfin's Webhook plugin sends this in the
    # X-Webhook-Token header, see deploy/docker/README.md.
    # WEBHOOK_TOKEN: replace-with-a-long-random-value # EDIT
    # Where Jellyfin sees the library folder.
    JELLYFIN_LIBRARY_DIR: /media
    # Source data backfill may start per day. Size it from encode time on small workers.
    BACKFILL_DAILY_GB: "2"
    # Admin UI. Login goes through Jellyfin.
    ADMIN_ADDR: 0.0.0.0:8202
    # The address people open for the admin UI, needed to serve it under a path
    # such as https://example.com/jellyfinner-admin. An https address always
    # marks the login cookie secure, so leave it unset for plain http.
    # ADMIN_URL: https://admin.example.com
    # Edge delivery: alice=edge1;bob=edge1
    EDGE_VIEWERS: ""
    # Cloud workers, optional: rent servers by the hour when the queue backs up.
    # List only the providers you add, in the order to try them. There is no
    # default order. See "Cloud workers" in deploy/docker/README.md.
    # CLOUD_PROVIDERS: ""
    # CLOUD_MAX: "1"
    # CLOUD_MAX_HOURS_PER_DAY: "8"
    # CLOUD_CHERRY_TOKEN: ""
    # CLOUD_CHERRY_PROJECT: ""
    # CLOUD_CHERRY_TYPES: ""
    # CLOUD_CHERRY_LOCATIONS: ""
    # CLOUD_CHERRY_IMAGE: ""
    # CLOUD_HETZNER_TOKEN: ""
    # CLOUD_HETZNER_TYPES: ""
    # CLOUD_HETZNER_LOCATIONS: ""
  volumes:
    # Your media, read-only. It is never changed.
    - /srv/originals:/originals:ro # EDIT the left side
    # One parent folder for the library and incoming uploads, on one filesystem.
    - /srv/store:/store # EDIT the left side
    # The database, which holds node tokens. Back this up and keep it private.
    - ./data/state:/var/lib/jellyfinner
  extra_hosts:
    - host.docker.internal:host-gateway
  networks: [jellyfinner]
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # Creates the data folders with the right owner, then exits, and the services
  # wait for it. There is no depends_on, because on Podman that stops a crashed
  # service restarting. It never touches your originals, or anything inside a folder.
  orchestrator-init:
    <<: *app
    user: "0:0"
    restart: "no"
    command: ["prepare", "--owner", *owner, "/var/lib/jellyfinner:750", "/store:755", "/store/library:755", "/store/incoming:755"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]

  orchestrator:
    <<: *app
    ports:
      # Point your reverse proxy at these. To reach them from a proxy in another
      # compose project, join its network instead, as shown at the end.
      - 127.0.0.1:8200:8200 # Control API, for workers and edge nodes
      - 127.0.0.1:8202:8202 # Admin UI
      # - 127.0.0.1:8201:8201 # Manual mode: playback events from a Jellyfin on this host
    healthcheck:
      test: ["CMD", "orchestrator", "health", "serve"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  # Edge delivery. A separate process, so restarting the orchestrator leaves
  # Jellyfin reachable. Uncomment, and point your public hostname here once
  # it is proven.
  #
  # router:
  #   <<: *app
  #   command: ["router"]
  #   ports:
  #     - 127.0.0.1:8204:8204
  #   healthcheck:
  #     test: ["CMD", "orchestrator", "health", "router"]
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 20s

  # Automatic HTTPS, if you have no reverse proxy. It needs ports 80 and 443, and
  # DNS for both hostnames. Use http://router:8204 for viewers once proven.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   entrypoint: ["sh", "-c"]
  #   command:
  #     - |
  #       caddy run --adapter caddyfile --config - <<'CADDY'
  #       tv.example.com {
  #         reverse_proxy host.docker.internal:8096
  #       }
  #       control.example.com {
  #         reverse_proxy orchestrator:8200 {
  #           flush_interval -1
  #         }
  #       }
  #       CADDY
  #   ports:
  #     - 80:80
  #     - 443:443
  #   extra_hosts:
  #     - host.docker.internal:host-gateway
  #   networks: [jellyfinner]
  #   volumes:
  #     - ./data/caddy/data:/data
  #     - ./data/caddy/config:/config

  # Jellyfin itself, if it is not already running. Point the library at /media.
  #
  # jellyfin:
  #   image: jellyfin/jellyfin:latest
  #   restart: unless-stopped
  #   ports:
  #     - 8096:8096
  #   networks: [jellyfinner]
  #   volumes:
  #     - ./data/jellyfin/config:/config
  #     - ./data/jellyfin/cache:/cache
  #     - /srv/store/library:/media:ro # EDIT the left side, as above

# The name is fixed, so a worker on this machine can join it. For a reverse proxy
# in another compose project, add its network here with external: true, and
# list it under the orchestrator's networks. Then proxy to orchestrator:8200.
networks:
  jellyfinner:
    name: jellyfinner
