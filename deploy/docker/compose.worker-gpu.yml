# Adds a VAAPI GPU to the worker. In .env, set RENDER_GID to the output of
# `getent group render | cut -d: -f3`, and use:
#   COMPOSE_FILE=compose.worker.yml:compose.worker-gpu.yml
services:
  worker:
    command: ["--backend", "vaapi", "--device", "${VAAPI_DEVICE:-/dev/dri/renderD128}"]
    devices:
      - ${VAAPI_DEVICE:-/dev/dri/renderD128}:${VAAPI_DEVICE:-/dev/dri/renderD128}
    group_add:
      - ${RENDER_GID:?set RENDER_GID in .env}
