# Builds the orchestrator from source. Needs the whole repository. Use it on top
# of the normal file, from this folder:
#   docker compose -f compose.orchestrator.yml -f compose.orchestrator.dev.yaml up -d --build
x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile.orchestrator

services:
  orchestrator-init:
    build: *build
    image: jellyfinner/orchestrator:local
  orchestrator:
    build: *build
    image: jellyfinner/orchestrator:local
