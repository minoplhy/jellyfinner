# Builds the worker from source. Needs the whole repository. Use it on top of the
# normal file, from this folder:
#   docker compose -f compose.worker.yml -f compose.worker.dev.yaml up -d --build
x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile.worker

services:
  worker-init:
    build: *build
    image: jellyfinner/worker:local
  worker:
    build: *build
    image: jellyfinner/worker:local
