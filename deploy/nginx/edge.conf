# Optional: nginx checks the signatures itself, in place of `edge-agent serve`.
# Keep the key in step with EDGE_NODES on the orchestrator.
server {
    listen 443 ssl;
    server_name edge1.example.com;
    ssl_certificate     /etc/ssl/edge/fullchain.pem;
    ssl_certificate_key /etc/ssl/edge/privkey.pem;

    root /edge;
    autoindex off;

    # Health probe from the orchestrator. Reveals nothing.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only hash-named files, only with a valid unexpired signature.
    location ~ "^/e/([0-9a-f]{64})\.mp4$" {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri REPLACE_WITH_SIGNING_KEY";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }
        alias /edge/$1.mp4;
        types { }
        default_type video/mp4;
        add_header Cache-Control "private, no-store";
        # Web players are on the Jellyfin origin.
        add_header Access-Control-Allow-Origin "*";
    }

    location / { return 404; }
}
