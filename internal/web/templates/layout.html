<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<title>{{.Title}} · Jellyfinner</title>
<link rel="stylesheet" href="{{base}}/static/app.css">
<script src="{{base}}/static/htmx.min.js"></script>
</head>
<body>
{{if .User}}
<nav>
  <span class="brand">Jellyfinner</span>
  <a href="{{base}}/">Dashboard</a>
  <a href="{{base}}/queue">Queue</a>
  <a href="{{base}}/library">Library</a>
  <a href="{{base}}/nodes">Nodes</a>
  <span class="right">
    <span>{{.Mode}} mode · {{.User}}</span>
    <form method="post" action="{{base}}/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button>Sign out</button></form>
  </span>
</nav>
{{end}}
<main>
{{with .Flash}}<div class="flash">{{.}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>
